; DisplayFix configuration. Official files must be UTF-8 without BOM; keep this ASCII first line before [Display].
[Display]
; 1 = 启用外传《上古传说》的动态宽屏修复；0 = 不修改游戏逻辑分辨率。
Enable=1

; 游戏内部逻辑高度。首轮建议先用 480；600 是另一档原生纵向基准。
; 480 + 16:9 会得到 854x480；600 + 16:9 会得到 1068x600。
; 更高值会真正扩大内部世界 Surface 和可见范围，不等于单纯提高最终输出清晰度，可能明显降低帧数。
BaseHeight=480

; Auto = 使用当前桌面/输出宽高比；也可手工写 16:9、16:10、21:9、32:9 等任意正整数比例。
AspectRatio=Auto

[Font]
; 1 = 把外传字体创建路径中的垂直 DPI 固定为 96，避免 Windows 125% 等缩放下字体被裁切。
; 这只影响字体创建，不改变整个进程 DPI，也不改变 cnc-ddraw 的窗口缩放。
FixDPI=1

[GUI]
; 1 = 启用从本传 v0.3 迁移、并已在外传静态闭合的底部主 HUD 水平居中逻辑。
; 外传 v0.1-test1 尚待实机验证，因此如果首轮出现 HUD 异常，可先改成 0 做 A/B 对照。
CenterMainHUD=1

; v0.1-test1 当前范围：
; - 标题/开场/主菜单保留外传原版前端 mode 4（静态闭合为 640x480）；
; - 进入 Strategy state 3 前切 GAMEPLAY profile，并临时把原版 force=0 改为 force=1，让同一 mode ID 真正重建为目标宽高；
; - 退出 Strategy 后先做原版清理，再恢复 FRONTEND profile，并强制 mode 4 / force=1 回到原版前端 Surface；
; - 96 DPI 字体修复、JMM 布局选择、底部 HUD 居中和 0x0B/0x0E 点击链均已完成静态映射，但尚待外传实机验证；
; - Steam 版专项兼容在本版故意禁用，等非 Steam 稳定后再处理。
