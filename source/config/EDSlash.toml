# EDSlash统一配置；UTF-8无BOM，CRLF。
# 本版本只读取此TOML，不读取旧INI。
[logging]
# 插件日志：关闭后不记录运行、性能和插件崩溃信息；已有文件保留。
enabled = true

[meta]
schema = 1

[display]
# 动态宽屏：让游戏画面适应较宽的屏幕，减少两侧空白。关闭时使用原游戏的画面方式。保存后需要退出游戏并重新打开才会改变。
enabled = true
# 逻辑高度：决定画面能显示多大范围的场景。第一次使用建议保持480。调大后通常能看见更多场景，但人物和物品会变小，也会增加电脑负担。保存后重新打开游戏生效。
base_height = 480
# 画面比例：选择画面的宽和高之间的比例。自动会跟随游戏窗口；16:9适合常见宽屏，4:3接近原游戏。保存后需要重新打开游戏。
aspect_ratio = "auto"

[font]
# 字体DPI修复：用于修正Windows显示缩放造成的字体大小异常。如果文字大小正常，可以保持当前选择。保存后需要退出并重新打开游戏。
fix_dpi = true

[gui]
# HUD居中：把画面底部的生命、体力、技能和物品快捷栏放在屏幕中间。关闭后使用原游戏位置。保存后直接改变位置，不需要重新打开游戏。
center_hud = true
# 辅助界面层级：开启后，背包等打开的窗口会显示在底部生命条和快捷栏的前面，避免被它们遮住。关闭后使用原游戏的叠放顺序。只改变谁在前面，不移动按钮。保存后直接生效。
auxiliary_above_hud = true

[qol.ground_items]
# 物品名称常显：不用按住查看键，就能看到地上物品的名字，更容易判断要不要拾取。关闭后按照原游戏的方式显示物品名字。
always_show_names = true

[qol.auto_pickup]
# 自动拾取范围：角色靠近地上物品时，插件会自动拾取选定类别。可选择关闭、只捡钱、钱和恢复道具、再加入宝石护身石，或者全部物品。仍然需要有足够的背包空间；不在范围内的物品可以手动拾取。
mode = 2
# 拾取扫描间隔：自动拾取每隔多久检查一次附近物品。1000毫秒等于1秒，100毫秒等于0.1秒。调小会更快尝试拾取，但更频繁检查会增加电脑负担；0表示每次游戏刷新输入都检查。
interval_ms = 100
# 掉落等待：怪物掉落物品后，自动拾取至少等待多久。1000毫秒等于1秒。调小可以更早拾取，但物品仍必须先完成原游戏的落地动作；0也不能拾取还在空中的物品。
drop_delay_ms = 1000

[controller]
# 手柄功能：开启后可以用手柄移动、战斗和操作菜单。关闭后使用原键盘鼠标；插件设置入口仍保留，可以再开启。保存后先松开手柄输入，等当前动作结束，才会切换。
enabled = true

[controller.input]
# 摇杆死区：摇杆推动超过这段幅度才开始控制角色。调大可以减少摇杆轻微偏移造成的自行移动，但需要推得更远。调小会更灵敏。连接手柄后先松开摇杆和按键，再开始使用。
deadzone = 8000

[controller.movement]
# 移动前探：控制角色朝摇杆方向移动时，向前查找移动目标的距离。数值越大，目标放得越远；数值越小，目标更靠近角色。走路和跑步共用这项。修改后松开输入，等当前动作结束生效。
lead_tiles = 12

[controller.mouse]
# 鼠标模式速度：在手柄的鼠标救援模式里，控制指针移动速度。调大移动更快，调小更方便对准小按钮。右摇杆使用较慢的速度。正常角色移动不受这项影响。
speed = 900

[controller.feedback]
# 手柄震动：切换手柄和鼠标救援模式时，让手柄轻微震动，提醒切换成功。关闭后不震动。手柄本身不支持震动时，这项不会产生效果。
rumble = true

[gameplay.combat]
# 受击才扣防御体力：按住LT防御时，只有成功格挡攻击才扣体力；没有受到攻击时不扣。关闭后恢复原游戏规则，持续防御也会不断扣体力。体力不足仍会按原游戏规则停止防御。
charge_guard_on_hit = true
# 跑步不扣体力：开启后跑步不消耗体力，战斗中也一样。关闭后恢复原游戏跑步消耗体力的规则。不改变跑步速度。
free_run = true
# 全方位格挡：按住LT防御时，可以格挡来自前后左右的普通攻击。关闭后只按原游戏允许的方向格挡。体力太少或遇到原本就无法格挡的攻击，仍可能受伤。
omnidirectional_guard = true
# 方向闪避：闪避时，左摇杆推向哪里，就朝哪里直线移动。关闭后使用原游戏的闪避方向和路径。当前闪避不会被半途改变；下一次闪避使用新选择。
directional_dodge = true
# 闪避距离：方向闪避一次移动多远。调大距离更长，调小更容易停在近处。64大约相当于一个地图格。墙壁和障碍仍会限制移动。只在方向闪避开启时使用；当前闪避结束后生效。
dodge_distance = 128

[gameplay.stamina]
# 防御体力消耗方式：选择防御扣掉多少体力：原版数值沿用这个角色的原值；按最大体力比例使用下方的防御体力消耗比例。百分比以整条体力的最大值计算，不是当前剩余体力。
guard_mode = "original"
# 防御体力消耗比例：设置防御每次消耗的体力。100%代表角色整条最大体力；1%代表其中百分之一。例如最大体力100时，1%就是1点。0表示不扣。需要将防御体力消耗方式设为按最大体力比例。
guard_percent = 0.00
# 攻击命中体力恢复方式：攻击确实伤害敌人时，可以恢复体力。选择与防御消耗一致，恢复量就和防御扣费相同；选择按最大体力比例，则使用下方的攻击命中体力恢复比例。挥空或完全被格挡不会恢复。
recovery_mode = "guard"
# 攻击命中体力恢复比例：设置每次攻击造成实际伤害后恢复的体力。100%代表整条最大体力；1%代表其中百分之一。0表示不恢复。需要将攻击命中体力恢复方式设为按最大体力比例。没有伤害敌人时不恢复，恢复也不能超过体力上限。
recovery_percent = 0.00

[controller.interaction]
# 正面调查最大距离：按调查键时，在角色周围多远的范围内寻找物品、人物、机关和换区点。调大可以更远选中，调小更容易区分靠近的目标。会优先选择较近和角色前方的目标；仍需满足原游戏的互动条件。默认160，最多480。
max_distance = 160

[controller.combat]
# 旧必杀输入模式：关闭时使用较安全的新方式：同时按住LT和RT，再按A/B/X/Y准备必杀；松开面键后再次按同一个键才释放。开启后只需LT加面键，较容易误触，连招切换也固定使用LT加方向键。
single_trigger_ultimate = false
# 连招切换输入：选择四套连招的切换方法。面键方式为按住LT，再按Y/B/A/X选择第1/2/3/4套；方向键方式为LT加上/右/下/左。只有旧必杀输入模式关闭时可以选择；旧模式固定用方向键。
combo_switch_input = "face"

[controller.skill_aim]
# 技能落点扩散耗时：按住跳跃预览键时，落点从近处扩到最远处需要多久。1000毫秒等于1秒。调小扩得更快，调大更方便慢慢选距离。松开按键后朝预览位置跳跃，长老使用瞬移。正在预览的这一次不受修改影响。
expand_time_ms = 1000

[controller.menu]
# 菜单确认取消交换：交换菜单里的确认和取消按钮。关闭为A确认、B取消；开启为B确认、A取消。不会交换战斗动作和组合键。当前插件设置窗口保持打开时的按法，下次打开才使用新按法。
swap_confirm_cancel = false
# 技能菜单选择模式：同时按住LT和RT，按L3展开左侧菜单，按R3展开右侧菜单；两个菜单只能展开一个。选择左摇杆导航全部、右摇杆导航全部，或各自独立导航。独立时左摇杆只选择左侧菜单，右摇杆只选择右侧菜单。松开任一扳机确认当前选择；保存后在操作空闲时生效。
skill_menu_navigation = "independent"

[controller.world_keys]
# 调查键：按下后与附近的人物、物品、机关或换区点互动。会优先选择较近和角色前方的目标。这是没有按住LT、RT等组合键时的按钮。菜单确认取消不随它改变。七项不能用同一个按钮；交换两键时，先把两项改好再保存。
interact = "a"
# 技能落点预览键：按住时预览动作落点，用左摇杆调整方向，松开后执行。默认用于跳跃，外传长老默认是瞬移。这是没有按住LT、RT等组合键时的按钮。菜单确认取消不随它改变。七项不能用同一个按钮；交换两键时，先把两项改好再保存。
skill_aim = "b"
# 左手动作键：执行左手动作，通常是普通攻击。左右手动作可在按住LT和RT后，按L3打开左手菜单或按R3打开右手菜单中选择。这是没有按住LT、RT等组合键时的按钮。菜单确认取消不随它改变。七项不能用同一个按钮；交换两键时，先把两项改好再保存。
left_action = "x"
# 右手动作键：执行右手当前选择的技能或连招套组。可以连续按下，按游戏原来的规则衔接动作。这是没有按住LT、RT等组合键时的按钮。菜单确认取消不随它改变。七项不能用同一个按钮；交换两键时，先把两项改好再保存。
right_action = "y"
# 奔跑键：移动中按下后开始跑步；松开左摇杆停止移动，再移动时恢复走路。不改变跑步速度。这是没有按住LT、RT等组合键时的按钮。菜单确认取消不随它改变。七项不能用同一个按钮；交换两键时，先把两项改好再保存。
run = "l3"
# 小地图键：按下显示或隐藏小地图，方便查看周围道路和位置。这是没有按住LT、RT等组合键时的按钮。菜单确认取消不随它改变。七项不能用同一个按钮；交换两键时，先把两项改好再保存。
minimap = "r3"
# 系统菜单键：按下打开或关闭游戏原本的系统菜单，用于存档、读档和返回等操作。插件设置仍用LT加RT加Back打开。这是没有按住LT、RT等组合键时的按钮。菜单确认取消不随它改变。七项不能用同一个按钮；交换两键时，先把两项改好再保存。
system_menu = "start"
