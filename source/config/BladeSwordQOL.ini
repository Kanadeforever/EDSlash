; BladeSwordQOL v0.1-dev1 configuration. UTF-8 without BOM.
[Display]
; 启用动态宽屏；
Enable=1
; 游戏内部逻辑高度；更高数值会扩大世界/FOV并显著增加老游戏负担；虽然不设上限但通常最大不超过720。
BaseHeight=480
; 游戏画面宽高比，绝大多数情况保持Auto自适应；也可以手工填写任意正整数比例，例如 16:9、32:9、8:9。
; 无论是 Auto 还是手工 W:H，AspectRatio 的最终 TargetWidth 都统一取“距离理想宽度最近的 8 像素倍数”以防止屏幕右侧出现透明竖条。
AspectRatio=Auto

[Font]
; 修正高 DPI 下的字体问题
FixDPI=1

[GUI]
; 游戏内底部主 HUD 水平居中。
CenterMainHUD=1
; 调整菜单显示层级以避免宽屏下被遮挡导致无法点击菜单按钮。
AuxiliaryUIAboveHUD=1

[GroundItems]
; 1=地面物品名称常时显示；0=沿用原版触发条件。
AlwaysShowNames=1

[AutoPickup]
; 0=关闭；1=仅金钱；2=金钱+回复道具；3=金钱+回复道具+宝石+护身石；4=全部。
Mode=2
; 自动执行一次原版 Z 拾取扫描的周期，单位毫秒。范围 0~3000；0 表示每个输入帧都可扫描。
IntervalMs=100
; 单个掉落物从出现起至少保留的时间，单位毫秒。范围 0~3000；仍必须完成原版落地动画。
DropDelayMs=1000
