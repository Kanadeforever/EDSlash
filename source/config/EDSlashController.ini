; 独立手柄基础版配置。A 调查，X 左手动作，Y 自定义连招，B 暂不绑定。
; 本体和外传使用同一份配置；首次连接请松开全部按键、摇杆、扳机。LT+十字键切四套连招。
[Input]
Deadzone=8000

[Movement]
; 走路和跑步共用的前探距离（地图格），默认 12，可调范围 6 到 32。
; 较大值减少方向量化，较小值更便于贴墙转弯；缺少此项的旧配置自动使用 12。
LeadTiles=12

[Mouse]
; 左摇杆每秒移动的桌面像素，右摇杆固定为三分之一。
Speed=900

[Feedback]
Enable=1

[SkillKeys]
; 数字是原版键盘虚拟键码。槽位直接发动已有绑定，不虚构角色技能。
; 顺序：A B X Y 上 下 左 右 LB RB BACK START L3 R3。
; 前十二项默认 Q W E R T Y U I O A S D，可按角色实际绑定修改。
; L3/R3 的特殊动作尚未获得可靠角色映射，0 表示暂不绑定。
Slot1=81
Slot2=87
Slot3=69
Slot4=82
Slot5=84
Slot6=89
Slot7=85
Slot8=73
Slot9=79
Slot10=65
Slot11=83
Slot12=68
Slot13=0
Slot14=0

[Combat]
; 1=防御只在原版确认受击时扣一次周期值；0=恢复原版防御周期性消耗。
ChargeGuardOnHit=1
; 1=跑步不扣体力；0=沿用原版奔跑扣费。
FreeRun=1
; -1=角色原防御周期值；0=不扣；正数=每次防御受击扣减的最大体力百分比，最多两位小数。
; 例：12.50 表示最大体力的 12.50%，最大体力 200 时扣 25 点；100.00 表示全部最大体力。
GuardHitCost=-1
; -1=与实际防御扣减值相同；0=不恢复；正数=每次攻击实际造成伤害时恢复的最大体力百分比，最多两位小数。
; 例：5.25 表示最大体力的 5.25%；范围 0 到 100.00，实际恢复受原版上限限制。
AttackHitRecovery=-1

; 1=手柄LT+左摇杆按摇杆方向直线闪避；0=完全使用原版目标周围的闪避机制。
; 关闭时仍通过原版闪避启动事件请求，是否有目标、冷却与距离资格均由原版判定。
DirectionalDodge=1
; 直线闪避距离，单位是游戏世界坐标（64单位=1地图格），默认128=2格，范围16到512。
; 仅DirectionalDodge=1生效；遇墙、不可通行地形或占用格会提前停止，不穿过障碍。
; 数值越大位移越远；在8个逻辑更新周期内完成。修改配置后重新启动游戏。
DodgeDistance=128
