; 独立手柄基础版配置。A 调查，X 左手动作，Y 自定义连招，B 暂不绑定。
; 本体和外传使用同一份配置；首次连接请松开全部按键、摇杆、扳机。LT+十字键切四套连招。
[Input]
Deadzone=8000

[Movement]
; 走路和跑步共用的前探距离（地图格），默认 12，可调范围 6 到 32。
; 较大值减少方向量化，较小值更便于贴墙转弯；缺少此项的旧配置自动使用 12。
LeadTiles=12

[Mouse]
; 左摇杆每秒移动的桌面像素，右摇杆固定为三分之一。
Speed=900

[Feedback]
Enable=1

[SkillKeys]
; 数字是原版键盘虚拟键码。槽位直接发动已有绑定，不虚构角色技能。
; 顺序：A B X Y 上 下 左 右 LB RB BACK START L3 R3。
; 前十二项默认 Q W E R T Y U I O A S D，可按角色实际绑定修改。
; L3/R3 的特殊动作尚未获得可靠角色映射，0 表示暂不绑定。
Slot1=81
Slot2=87
Slot3=69
Slot4=82
Slot5=84
Slot6=89
Slot7=85
Slot8=73
Slot9=79
Slot10=65
Slot11=83
Slot12=68
Slot13=0
Slot14=0

[Combat]
; 1=防御只在原版确认受击时扣一次周期值；0=恢复原版防御周期性消耗。
ChargeGuardOnHit=1
; 1=跑步不扣体力；0=沿用原版奔跑扣费。
FreeRun=1
; -1=角色原防御周期值；0=不扣；正数=每次防御受击扣减的体力点数。
GuardHitCost=-1
; -1=与实际防御扣减值相同；0=不恢复；正数=每次攻击命中恢复的体力点数。
AttackHitRecovery=-1
