; DisplayFix configuration. Official files must be UTF-8 without BOM; keep this ASCII first line before [Display].
[Display]
; 1 = 启用显示比例修复；0 = 不修改游戏逻辑分辨率。
Enable=1

; 逻辑纵向高度，同时也可以理解成“世界缩放 / 类 FOV”参数。
; 480 = 接近原生 640x480 的纵向视野，当前最稳定、最推荐的基准。
; 600 = 接近原生 800x600 的纵向视野。
; 数值越大：画面视觉上越“缩远”；数值越小：画面视觉上越“拉近”。
; 0 或负数无效，会自动回退到 480。
BaseHeight=480

; Auto = 自动读取当前桌面/输出宽高比。
; 也可以手工写任意 W:H，例如 5:4、4:3、3:2、16:10、16:9、21:9、32:9。
; 没有“宽屏白名单”，所有合法正整数比例都使用同一公式：X = Y × W / H。
AspectRatio=Auto

[Font]
; 1 = 启用高 DPI 字体修复; 0 = 不修改字体创建路径。
FixDPI=1

[GUI]
; 1 = 底部主 HUD 水平居中。
CenterMainHUD=1