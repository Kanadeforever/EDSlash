; DisplayFix configuration. Official files must be UTF-8 without BOM; keep this ASCII first line before [Display].
[Display]
; 1 = 启用显示比例修复；0 = 不修改游戏逻辑分辨率。
Enable=1

; 逻辑纵向高度，同时也可以理解成“世界缩放 / 类 FOV”参数。
; 480 = 接近原生 640x480 的纵向视野，当前最稳定、最推荐的基准。
; 600 = 接近原生 800x600 的纵向视野。
; 480 / 600 是 fixed-Y 宽屏的推荐档：保持原游戏纵向视野量级，再由 cnc-ddraw 放大到 1080p/4K。
; 也可以填写 500、540、720、900、1080 等任意正整数，本版仍不设置人为最大值。
; 但是这些值不是“输出画质”：BaseHeight 越大，游戏内部真的会创建更大的世界 Surface、显示更多地图范围，
; CPU/GPU/对象更新与 DirectDraw 成本都会增加。720/900/1080 属于高级 FOV/世界缩放实验，可能明显掉帧。
; 数值越大：一次看到的世界范围越多，画面视觉上越“缩远”。
; 数值越小：一次看到的世界范围越少，画面视觉上越“拉近”。
; 0 或负数无效，会自动回退到 480。
; 极端大的数值最终仍可能超过老 DirectDraw / 游戏本身能够创建的 Surface 尺寸。
BaseHeight=480

; Auto = 自动读取当前桌面/输出宽高比。
; 也可以手工写任意 W:H，例如 5:4、4:3、3:2、16:10、16:9、21:9、32:9。
; 没有“宽屏白名单”，所有合法正整数比例都使用同一公式：X = Y × W / H。
AspectRatio=Auto

[Font]
; 1 = 启用已经在 4K / Windows 125% DPI 下实机通过的 96 DPI 字体修复。
; 0 = 不修改字体创建路径。
FixDPI=1

[GUI]
; 1 = 只把底部主 HUD 水平居中。
; 小地图、右侧按钮以及其他左右边缘顶层 UI 保持原游戏锚定方式。
; 对极少数比 4:3 更窄的比例，允许底部 HUD 左右少量裁切，不做缩放或特殊重排。
;
; 游戏本身只确认存在两套 JMM GUI 模板：
;   BaseHeight < 600  -> 沿用 480 系 JMMDL.txt / 640 参考宽度；
;   BaseHeight >= 600 -> 沿用 600 系 JMMDL800.txt / 800 参考宽度。
; 世界逻辑高度本身不会因为这个 GUI 分界被截断，720 仍然是真正的 720 高逻辑画面。
CenterMainHUD=1

; v0.3 封版说明（基于 test15 实机通过）：
; 顶部两个圆形按钮已由实机确认是 control ID 0x0B / 0x0E。
; test6 的全局 mouse-release fallback + test8 的世界输入防穿透路径继续保留；
; test7 包装 0x4B44F0 会破坏普通地图左键和 Alt+F4，已经永久废弃。
;
; Steam 版继续使用 test10 已实机通过的 delayed full JMM apply：HUD/顶层 UI/资源根成熟后，
; 只调用一次游戏原版 0x4B35F0；当前仍要求已经进入 Strategy GAMEPLAY profile。
;
; 前端/游戏内生命周期已经经过 test11~test14 多轮排除：
;   test11：HUD +0x58 自动布局在主菜单也会发生，不能作为 gameplay gate；
;   test12：world 全局对象在主菜单也已经存在，同样不能作为 gameplay gate；
;   test13：Strategy state=3 是正确进入游戏时机，但原版 0x407000 使用 force=0，mode ID 未变化时会早退；
;   test14：进入游戏临时 force=1 后，实机 live 已正确变成 854x480，说明 enter 路径成立；
;           但退出只恢复 FRONTEND 代码 profile，实际宽屏 Surface 没有重建回 640x480，返回标题后仍错乱。
;
; v0.3 不让标题本身宽屏。test15 已实机证明下面这套原游戏生命周期可用：
;   标题/启动动画/前端 = 原版 mode 4，也就是实际 640x480 4:3；
;   Strategy/gameplay   = TargetWidth x BaseHeight；
;   退出 Strategy 后    = 先做原版清理，再恢复 FRONTEND profile，并强制 mode 4 / force=1 重建前端 Surface。
;
; 反汇编已确认原游戏启动路径 0x4053D8~0x4053E4 自己就会请求 mode 4 并调用同一个 0x404D30，
; 所以这里不是人为制造“特殊菜单分辨率”，而是把返回前端时丢失的原版显示模式语义补回来。
; test15 实机：进入游戏 live=854x480；退出回标题 live=640x480，v0.3 以此封版。
