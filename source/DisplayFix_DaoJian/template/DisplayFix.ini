; DisplayFix configuration. Official files must be UTF-8 without BOM; keep this ASCII first line before [Display].
[Display]
; 1 = 启用动态宽屏；0 = 原版显示逻辑。
Enable=1

; 逻辑高度，可以填写任意正整数，不设置人为最大值，过大可能明显掉帧。
; 数值越大，角色和界面越小、可见内容更多; 数值越小，角色和界面越大、可见内容更少; 0 或负数无效，会自动回退到 480。
BaseHeight=480

; Auto = 使用当前桌面/输出宽高比；也可手工写 5:4、4:3、3:2、16:10、16:9、21:9、32:9 等任意正整数比例。
; 没有“宽屏白名单”，所有合法正整数比例都使用同一公式：X = Y × W / H。
AspectRatio=Auto

[Font]
; 1 = 启用高 DPI 字体修复; 0 = 不修改字体创建路径。
FixDPI=1

[GUI]
; 1 = 主 HUD 水平居中。
CenterMainHUD=1
