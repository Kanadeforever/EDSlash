; DisplayFix configuration. Keep this first line so Win32 profile APIs remain safe even if an editor adds a UTF-8 BOM.
[Display]
; 1 = 启用显示比例修复；0 = 不修改游戏逻辑分辨率。
Enable=1

; 逻辑纵向高度，同时也可以理解成“世界缩放 / 类 FOV”参数。
; 480 = 接近原生 640x480 的纵向视野，当前最稳定、最推荐的基准。
; 600 = 接近原生 800x600 的纵向视野。
; 也可以填写 500、540、720、900 等任意正整数；本版不再设置人为最大值。
; 数值越大：一次看到的世界范围越多，画面视觉上越“缩远”。
; 数值越小：一次看到的世界范围越少，画面视觉上越“拉近”。
; 0 或负数无效，会自动回退到 480。
; 注意：极端大的数值最终仍可能超过老 DirectDraw / 游戏本身能够创建的 Surface 尺寸，
; 那属于游戏/显卡接口的客观能力边界，不是 DisplayFix 设置的人为上限。
BaseHeight=480

; Auto = 自动读取当前桌面/输出宽高比。
; 也可以手工写任意 W:H，例如 5:4、4:3、3:2、16:10、16:9、21:9、32:9。
; 没有“宽屏白名单”，所有合法正整数比例都使用同一公式：X = Y × W / H。
AspectRatio=Auto

[Font]
; 1 = 启用已经在 4K / Windows 125% DPI 下实机通过的 96 DPI 字体修复。
; 0 = 不修改字体创建路径。
FixDPI=1

[GUI]
; 1 = 只把底部主 HUD 水平居中。
; 小地图、右侧按钮以及其他左右边缘顶层 UI 保持原游戏锚定方式。
; 对极少数比 4:3 更窄的比例，允许底部 HUD 左右少量裁切，不做缩放或特殊重排。
;
; 游戏本身只确认存在两套 JMM GUI 模板：
;   BaseHeight < 600  -> 沿用 480 系 JMMDL.txt / 640 参考宽度；
;   BaseHeight >= 600 -> 沿用 600 系 JMMDL800.txt / 800 参考宽度。
; 世界逻辑高度本身不会因为这个 GUI 分界被截断，720 仍然是真正的 720 高逻辑画面。
CenterMainHUD=1

; v0.3-test11 说明：
; 顶部两个圆形按钮已由实机确认是 control ID 0x0B / 0x0E。
; test6 已在全局鼠标释放层让这两个窗口能够正常打开。
; test7 曾包装全局 UI mouse-press，虽然能阻止角色移动，却导致普通地图左键和 Alt+F4 失效，已彻底废弃。
; test8 完全不碰原版 0x4B44F0，只在真正调用世界输入 0x473F10 前检查 0x0B/0x0E；
; 命中时只跳过这一次世界输入，其他位置继续走原版路径。
; 正常使用保持 1；只有诊断原始位置时才临时改成 0。
;
; Steam 版：ComeOnSteam.exe 会额外加载 ComeOn.dll。test9 已实机证明单纯补做 vtable+0x14
; 尺寸广播无效，因为非 Steam 的第二阶段布局在广播前还会重新加载 JMMDL/JMMDL800 资源。
; test10 只在 Steam、HUD/顶层 UI 已成熟且游戏资源根目录已初始化后，补调用一次原版 0x4B35F0；
; 这样资源加载与后续广播都继续走游戏自己的完整流程，非 Steam 路径完全不额外执行。
;
; test11 前端/动画生命周期：
; 启动动画和主菜单继续使用原版固定 640x480 / 4:3，不会在 ASI 初始化时提前扩到 BaseHeight。
; 主 HUD 真正出现后才切换到 TargetWidth x BaseHeight；HUD 生命周期结束时恢复前端代码规则。
; 因此主菜单最终应由 cnc-ddraw 把完整 640x480 源画面等比放大并居中，而不是在大逻辑 Surface 左上角只画一块内容。
; 本功能目前是 test11 新实验，尚待实机验证。
