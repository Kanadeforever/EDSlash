; DisplayFix configuration. Official files must be UTF-8 without BOM; keep this ASCII first line before [Display].
[Display]
; 1 = 启用动态宽屏；0 = 原版显示逻辑。
Enable=1

; 逻辑高度，可以填写任意正整数，不设置人为最大值，过大可能明显掉帧。
; 数值越大，角色和界面越小、可见内容更多; 数值越小，角色和界面越大、可见内容更少; 0 或负数无效，会自动回退到 480。
BaseHeight=480

; Auto = 使用当前桌面/输出宽高比；也可手工写 5:4、4:3、3:2、16:10、16:9、21:9、32:9 等任意正整数比例。
; stripe1 没有“宽屏白名单”：先按 X = Y × W / H 得到理想宽度，再选择距离最近的 8 像素倍数作为实际 TargetWidth。
; 这是针对历史最右侧竖条的单变量实验；例如 BaseHeight=480 + 16:9 会从旧版 854 改为 856，24:9 仍保持 1280。
AspectRatio=Auto

[Font]
; 1 = 启用高 DPI 字体修复; 0 = 不修改字体创建路径。
FixDPI=1

[GUI]
; 1 = 主 HUD 水平居中。
CenterMainHUD=1

; 1 = 启用 layer1d 已实机闭合的辅助 GUI 层级修复：菜单仍保持原版坐标、按钮业务和快捷键；
;     绘制侧把与居中主 HUD 冲突的物品/装备/技能及已确认独立面板延后到 HUD 后绘制；
;     输入侧只在原版顶层 picker 已经选中 HUD、鼠标又命中这些菜单 root 时，替换这一次 picker 返回值。
;     不写顶层链，不改 X/Y、GetCursorPos、self+0xA8、child 坐标、vtable+0x30 或键盘快捷键。
; 0 = 不安装这套辅助 GUI Draw / 单次输入 root Hook，保留其它宽屏、HUD、Strategy、Steam JMM 和字体修复。
; 该项只有 CenterMainHUD=1 时才有意义；stripe1 只改 TargetWidth 8 像素对齐，与这个 GUI 开关互不耦合。
AuxiliaryUIAboveHUD=1
