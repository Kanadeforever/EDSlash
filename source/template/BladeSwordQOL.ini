; BladeSwordQOL v0.1-dev1 configuration. UTF-8 without BOM.
[Display]
; 1 = 启用 DisplayFix 动态宽屏；0 = 保持原版显示逻辑。
Enable=1

; 游戏内部逻辑高度。推荐 480 或 600；更高数值会扩大世界/FOV并显著增加老游戏负担。
BaseHeight=480

; Auto = 使用当前桌面/输出宽高比；也可以手工填写任意正整数比例，例如 16:9、32:9、8:9。
; 无论这里是 Auto 还是手工 W:H，AspectRatio 的最终 TargetWidth 都统一取“距离理想宽度最近的 8 像素倍数”。
; 8 像素对齐是 AspectRatio 宽度求值规则的一部分，不是 Auto 专项，也不是独立 StripeFix 模块。
AspectRatio=Auto

[Font]
; 1 = 修正高 DPI 下字体创建路径；0 = 不修改字体。
FixDPI=1

[GUI]
; 1 = 游戏内底部主 HUD 水平居中。
CenterMainHUD=1

; 1 = 启用 layer1d 已实机闭合的辅助 GUI 绘制/输入层级修复。
AuxiliaryUIAboveHUD=1
