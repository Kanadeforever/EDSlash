; 独立手柄基础版配置。A 调查，X 左手动作，Y 右手动作，B 暂不绑定。
; 本体和外传使用同一份配置；首次连接请松开全部按键、摇杆、扳机。
[Input]
Deadzone=8000

[Mouse]
; 左摇杆每秒移动的桌面像素，右摇杆固定为三分之一。
Speed=900

[Feedback]
Enable=1

[SkillKeys]
; 数字是原版键盘虚拟键码。槽位只选择已有绑定，不虚构角色技能。
; 顺序：A B X Y 上 下 左 右 LB RB BACK START L3 R3。
; 前十二项默认 Q W E R T Y U I O A S D，可按角色实际绑定修改。
; L3/R3 的特殊动作尚未获得可靠角色映射，0 表示暂不绑定。
Slot1=81
Slot2=87
Slot3=69
Slot4=82
Slot5=84
Slot6=89
Slot7=85
Slot8=73
Slot9=79
Slot10=65
Slot11=83
Slot12=68
Slot13=0
